ware Engineer","description":"<p>OpenGov is a provider of AI and ERP solutions for local and state governments. The Software Engineering Intern will contribute to production web applications and APIs across the full stack, while designing REST endpoints, writing tests, participating in code reviews, collaborating in agile processes, resolving bugs and performance issues, and exploring AI-assisted development tools.</p><br><p>Responsibilities</p><ul><li>Build and ship features across our production codebase, contributing to web applications and APIs that serve government customers every day</li><li>Design, document, and implement REST API endpoints in collaboration with senior engineers, learning how scalable service contracts are built and maintained</li><li>Write unit and integration tests alongside feature work, developing habits around code quality and test coverage from day one</li><li>Participate in code reviews — both receiving and giving feedback — to sharpen your craft and understand how the team maintains a high bar for quality</li><li>Collaborate with engineers during sprint planning, standups, and retrospectives to experience the full rhythm of an agile engineering team</li><li>Investigate and resolve bugs and performance issues, tracing problems through the stack to develop debugging instincts in a real production environment</li><li>Explore AI-assisted development tools to accelerate your workflow and get exposure to how modern engineering teams are integrating AI into their day-to-day</li></ul><br><p>Skills</p><ul><li>Currently pursuing a Bachelor's degree in Computer Science, Computer Engineering, or a related field, or equivalent program</li><li>Proficiency in at least one modern programming language (TypeScript, JavaScript, React, or Node)</li><li>Experience building with AI-driven UX, agents, and workflow automation (direct ML experience not required)</li><li>Ability to collaborate effectively in a team environment and communicate clearly about technical problems</li><li>Strong problem-solving skills and attention to detail — you spot edge cases and ask good questions</li><li>Curiosity and a self-starter mindset; eager to learn from feedback and iterate quickly</li><li>Familiarity with front-end frameworks such as Angular, React, or Redux</li><li>Basic experience with Git or similar version control tools</li><li>Personal or open-source projects you're proud of — GitHub link welcome</li><li>Strong written or verbal communication skills; bonus if you've shared your work via blogs, talks, or demos</li><li>GPA 3.0+</li></ul><br><p>Benefits</p><ul><li>Comprehensive healthcare options for individuals and families</li><li>Flexible vacation policy and paid company holidays</li><li>401(k) with company match</li><li>Paid parental leave, wellness stipends, and HSA contributions</li><li>Professional development and growth opportunities</li><li>A collaborative office environment with weekly catered lunches.</li></ul><br><p>Company Overview</p><li>Our mission is to power more effective and accountable government. It was founded in 2012, and is headquartered in San Francisco, California, USA, with a workforce of 501-1000 employees. Its website is http://opengov.com.</li><br><p>Company H1B Sponsorship</p><li>OpenGov Inc. has a track record of offering H1B sponsorships, with 5 in 2026, 24 in 2025, 12 in 2024, 10 in 2023, 14 in 2022, 4 in 2021, 9 in 2020. Please note that this does not guarantee sponsorship for this specific role.</li><br>","datePosted":"2026-09-14 21:51:38","employmentType":"INTERN","hiringOrganization":{"@type":"Organization","name":"OpenGov Inc.","sameAs":"http://opengov.com","logo":"https://media.licdn.com/dms/image/v2/D560BAQEp7iHXByag-g/company-logo_100_100/B56ZvNvgKSK4AQ-/0/1768683340838/opengov_inc_logo?e=2147483647&v=beta&t=z66GJh8HikrRDkz7leHTVauQitDsbj8BQA3MlQHXc44"},"jobLocation":{"address":{"addressLocality":"Boston","addressRegion":"MA","addressCountry":"US","@type":"PostalAddress"},"latitude":0,
