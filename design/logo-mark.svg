<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Dispatch mark, standalone (DESIGN.md §1.5). Theme-aware accent. -->
  <style>
    .track { stroke: #6d7dff; }
    .station { fill: #0e0f14; stroke: #6d7dff; }
    .delivered { fill: #6d7dff; }
    @media (prefers-color-scheme: light) {
      .track { stroke: #2f3ee8; }
      .station { fill: #f5f2ea; stroke: #2f3ee8; }
      .delivered { fill: #2f3ee8; }
    }
  </style>
  <path class="track" d="M6 18 L18 6" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle class="station" cx="6" cy="18" r="2.4" stroke-width="2"/>
  <circle class="station" cx="12" cy="12" r="2.4" stroke-width="2"/>
  <circle class="delivered" cx="18" cy="6" r="3"/>
</svg>
