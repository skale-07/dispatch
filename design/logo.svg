<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 40" width="232" height="40">
  <!-- Dispatch horizontal lockup: waypoint-track mark + monospace wordmark.
       Theme-aware via prefers-color-scheme; usage rules in DESIGN.md §1.5. -->
  <style>
    .track { stroke: #6d7dff; }
    .station { fill: #0e0f14; stroke: #6d7dff; }
    .delivered { fill: #6d7dff; }
    .word { fill: #ece9e1; }
    .segment { fill: #6d7dff; }
    text {
      font-family: "SFMono-Regular", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    @media (prefers-color-scheme: light) {
      .track { stroke: #2f3ee8; }
      .station { fill: #f5f2ea; stroke: #2f3ee8; }
      .delivered { fill: #2f3ee8; }
      .word { fill: #17161a; }
      .segment { fill: #2f3ee8; }
    }
  </style>
  <g transform="translate(4, 4)">
    <path class="track" d="M8 24 L24 8" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle class="station" cx="8" cy="24" r="3.2" stroke-width="2.6"/>
    <circle class="station" cx="16" cy="16" r="3.2" stroke-width="2.6"/>
    <circle class="delivered" cx="24" cy="8" r="4"/>
  </g>
  <text x="44" y="27"><tspan class="word">dispatch</tspan><tspan class="segment">·console</tspan></text>
</svg>
