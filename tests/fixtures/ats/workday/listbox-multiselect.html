<!DOCTYPE html>
<html>
<!--
  #67 progressive-overload fixture — Workday listbox-button dropdown +
  multiselect search widget, modeled on the LIVE tiaa.wd1 apply wizard DOM
  (probes 2026-08-31) one level harder:
    - the multiselect input carries aria-invalid BEFORE id in attribute
      order (the getAttr boundary bug read id="false");
    - a hidden hex-token decoy input sits beside the listbox button
      (night19 #16b decoy);
    - the chips list (selectedItemList) is an ALWAYS-VISIBLE role=listbox
      holding a preselected pill — the options-list resolver must not
      pick it;
    - the multiselect options are "virtualized": the full set only
      appears after filter text is typed;
    - a page-chrome listbox button (settings) has NO label[for] and must
      never be discovered as a field.
-->
<body>
  <button aria-expanded="false" aria-haspopup="listbox" data-automation-id="utilityMenuButton" id="settingsSelectorButton">⚙</button>

  <div data-automation-id="formField-phoneType" data-fkit-id="phoneNumber--phoneType">
    <label for="phoneNumber--phoneType"><span>Phone Device Type<abbr aria-hidden="true">*</abbr></span></label>
    <div>
      <button aria-haspopup="listbox" type="button" value="0959caecc755017829c438a5ba007f07" aria-label="Phone Device Type Select One Required" name="phoneType" id="phoneNumber--phoneType">Select One</button>
      <input type="text" style="display:none" value="0959caecc755017829c438a5ba007f07">
    </div>
  </div>
  <ul role="listbox" id="phoneTypeList" style="display:none">
    <li data-value="" role="option" aria-disabled="true" id="select-one"><div>Select One</div></li>
    <li data-value="v1" role="option" id="opt-corp"><div>Corporate Mobile</div></li>
    <li data-value="v2" role="option" id="opt-fax"><div>Fax</div></li>
    <li data-value="v3" role="option" id="opt-land"><div>Landline</div></li>
    <li data-value="v4" role="option" id="opt-mob"><div>Mobile</div></li>
  </ul>

  <div data-automation-id="formField-source" data-fkit-id="source--source">
    <label for="source--source"><span>How Did You Hear About Us?<abbr aria-hidden="true">*</abbr></span></label>
    <div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect" id="ms-source">
      <div data-automation-id="multiselectInputContainer">
        <input enterkeyhint="search" placeholder="Search" aria-invalid="false" aria-disabled="false" aria-required="true" autocomplete="off" data-uxi-widget-type="selectinput" data-uxi-multiselect-id="ms-source" id="source--source" value="">
        <div data-automation-id="promptSelectionLabel"></div>
      </div>
      <ul role="listbox" tabindex="0" data-automation-id="selectedItemList" aria-label="items selected"></ul>
    </div>
  </div>

  <div data-automation-id="formField-countryPhoneCode" data-fkit-id="phoneNumber--countryPhoneCode">
    <label for="phoneNumber--countryPhoneCode"><span>Country Phone Code<abbr aria-hidden="true">*</abbr></span></label>
    <div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect" id="ms-cpc">
      <div data-automation-id="multiselectInputContainer">
        <input enterkeyhint="search" placeholder="Search" aria-invalid="false" aria-required="true" data-uxi-widget-type="selectinput" data-uxi-multiselect-id="ms-cpc" id="phoneNumber--countryPhoneCode" value="">
      </div>
      <ul role="listbox" tabindex="0" data-automation-id="selectedItemList" aria-label="items selected">
        <li role="presentation" data-automation-id="menuItem"><div role="option" data-automation-id="selectedItem" aria-label="United States of America (+1), press delete to clear value.">United States of America (+1)</div></li>
      </ul>
    </div>
  </div>

  <div data-automation-id="activeListContainer" role="listbox" id="sourceOptions" style="display:none"></div>

  <script>
    // Listbox button: click toggles the ul; picking an option sets the
    // button text and closes.
    const btn = document.getElementById('phoneNumber--phoneType');
    const list = document.getElementById('phoneTypeList');
    btn.addEventListener('click', () => { list.style.display = 'block'; });
    for (const li of list.querySelectorAll('li[role=option]:not([aria-disabled])')) {
      li.addEventListener('click', () => {
        btn.textContent = li.textContent.trim();
        list.style.display = 'none';
      });
    }

    // Multiselect: options render only AFTER a filter is typed
    // (virtualized shape); picking one adds a chip to selectedItemList.
    const ALL_SOURCES = ['College Event', 'Company Website', 'Employee Referral', 'Job Board', 'LinkedIn', 'Recruiter', 'Social Media'];
    const input = document.getElementById('source--source');
    const popup = document.getElementById('sourceOptions');
    const chips = document.querySelector('#ms-source [data-automation-id=selectedItemList]');
    function renderOptions(filter) {
      const subset = filter
        ? ALL_SOURCES.filter((s) => s.toLowerCase().includes(filter.toLowerCase()))
        : ALL_SOURCES.slice(0, 3); // virtualization window
      popup.innerHTML = '';
      for (const s of subset) {
        const div = document.createElement('div');
        div.setAttribute('role', 'option');
        div.setAttribute('data-automation-id', 'menuItem');
        div.textContent = s;
        div.addEventListener('click', () => {
          const li = document.createElement('li');
          li.setAttribute('role', 'presentation');
          const pill = document.createElement('div');
          pill.setAttribute('role', 'option');
          pill.setAttribute('data-automation-id', 'selectedItem');
          pill.textContent = s;
          li.appendChild(pill);
          chips.appendChild(li);
          popup.style.display = 'none';
          input.value = '';
        });
        popup.appendChild(div);
      }
      popup.style.display = 'block';
    }
    input.addEventListener('click', () => renderOptions(''));
    input.addEventListener('input', () => renderOptions(input.value));
    input.addEventListener('keyup', () => renderOptions(input.value));
  </script>
</body>
</html>
