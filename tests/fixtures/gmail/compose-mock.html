<!DOCTYPE html>
<html>
<head><title>Mock Gmail</title>
<style>
  #composeWin { display: none; border: 1px solid #888; padding: 12px; width: 480px; }
  #composeWin.open { display: block; }
</style></head>
<body>
<div gh="cm" role="button" onclick="document.getElementById('composeWin').classList.add('open')">Compose</div>

<div id="composeWin">
  <b>New Message</b>
  <img class="Ha" alt="Close" src="" onclick="saveDraft()" style="width:12px;height:12px;cursor:pointer" />
  <div><input aria-label="To recipients" id="to" /></div>
  <div><input name="subjectbox" id="subject" /></div>
  <div aria-label="Message Body" contenteditable="true" id="body" style="min-height:80px;border:1px solid #ccd"></div>
  <input type="file" name="Filedata" id="filedata" style="display:none" />
  <div id="attachments"></div>
  <div aria-label="Send" role="button" data-tooltip="Send ‪(Ctrl-Enter)‬" onclick="window.__sendClicked = true">Send</div>
</div>

<div id="drafts"></div>

<script>
  window.__sendClicked = false;
  window.__drafts = [];
  // Mirror Gmail Trusted Types: innerHTML assignment on the compose
  // body throws. Draft fill must use DOM nodes (createElement / textContent).
  (function () {
    const el = document.getElementById('body');
    const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
    if (!el || !desc || !desc.get) return;
    const nativeGet = desc.get;
    Object.defineProperty(el, 'innerHTML', {
      configurable: true,
      enumerable: true,
      get() { return nativeGet.call(this); },
      set() {
        throw new TypeError("Failed to set the 'innerHTML' property on 'Element': This document requires 'TrustedHTML' assignment.");
      },
    });
  })();
  // Attachments: Gmail renders a chip per uploaded file. __suppressChip
  // models an upload Gmail never confirms.
  window.__suppressChip = false;
  document.getElementById('filedata').addEventListener('change', function () {
    if (window.__suppressChip) return;
    for (const f of Array.from(this.files)) {
      const chip = document.createElement('div');
      chip.setAttribute('aria-label', 'Attachment: ' + f.name);
      chip.dataset.name = f.name;
      chip.dataset.size = String(f.size);
      chip.textContent = f.name;
      document.getElementById('attachments').appendChild(chip);
    }
  });
  function saveDraft() {
    const d = {
      to: document.getElementById('to').value,
      subject: document.getElementById('subject').value,
      body: document.getElementById('body').innerText,
      bodyHtml: document.getElementById('body').innerHTML,
      attachments: Array.from(document.querySelectorAll('#attachments [data-name]')).map(
        (el) => ({ name: el.dataset.name, size: Number(el.dataset.size) }),
      ),
    };
    window.__drafts.push(d);
    document.getElementById('composeWin').classList.remove('open');
    const row = document.createElement('div');
    row.className = 'draft-row';
    row.textContent = 'Draft to ' + d.to + ' — ' + d.subject;
    document.getElementById('drafts').appendChild(row);
  }
</script>
</body>
</html>
