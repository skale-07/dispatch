<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Surface-neutral: each app surface sets its own document.title on mount. -->
    <title>Dispatch</title>
    <meta
      name="description"
      content="Dispatch is an agent that does your job applications — it fills the forms on real employer sites from a profile you write once, and keeps a screenshot receipt for everything it submits in your name."
    />
    <!-- Palette colors only (tokens.css --bg light / dark). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <!-- Social preview. %VITE_PUBLIC_URL% is the deployed origin, set at
         build time (vercel env); blank in an unconfigured build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dispatch" />
    <meta property="og:title" content="Dispatch — job applications, done with receipts" />
    <meta
      property="og:description"
      content="An agent that fills the forms on real employer sites while you're in class, and keeps a screenshot receipt for every one. Invite-only."
    />
    <meta property="og:url" content="%VITE_PUBLIC_URL%/" />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dispatch — job applications, done with receipts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dispatch — job applications, done with receipts" />
    <meta
      name="twitter:description"
      content="An agent that fills the forms on real employer sites while you're in class, and keeps a screenshot receipt for every one. Invite-only."
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
